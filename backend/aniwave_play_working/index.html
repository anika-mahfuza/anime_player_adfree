<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AniWave Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #eee; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 320px; min-width: 320px; background: #1a1a1a; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; }
  #search-box { padding: 12px; border-bottom: 1px solid #2a2a2a; }
  #search-box input { width: 100%; padding: 8px 12px; background: #111; border: 1px solid #333; border-radius: 6px; color: #eee; font-size: 14px; outline: none; }
  #search-box input:focus { border-color: #555; }
  #results { flex: 1; overflow-y: auto; }
  .result-item { display: flex; gap: 10px; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #222; transition: background .15s; }
  .result-item:hover { background: #222; }
  .result-item img { width: 42px; height: 60px; object-fit: cover; border-radius: 3px; flex-shrink: 0; }
  .result-info { display: flex; flex-direction: column; gap: 4px; }
  .result-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .result-meta { font-size: 11px; color: #888; }
  #ep-panel { display: none; flex-direction: column; border-top: 1px solid #2a2a2a; max-height: 50%; }
  #ep-header { padding: 10px 12px; font-size: 13px; font-weight: 600; color: #aaa; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  #ep-header button { background: none; border: 1px solid #444; color: #aaa; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  #ep-list { overflow-y: auto; flex: 1; }
  .ep-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #1e1e1e; display: flex; justify-content: space-between; transition: background .15s; }
  .ep-item:hover { background: #222; }
  .ep-item.active { background: #2a3a2a; color: #6f6; }
  .ep-item .ep-title { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  #ep-pages { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid #222; }
  .page-btn { background: #222; border: 1px solid #333; color: #aaa; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .page-btn.active { background: #444; color: #fff; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #player-wrap { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #placeholder { color: #444; font-size: 16px; text-align: center; }
  #controls { padding: 10px 16px; background: #151515; border-top: 1px solid #222; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #controls select { background: #222; border: 1px solid #333; color: #eee; padding: 5px 10px; border-radius: 5px; font-size: 13px; }
  #status { font-size: 12px; color: #888; flex: 1; }
  #ep-title { font-size: 13px; font-weight: 600; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #444; border-top-color: #aaa; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sidebar">
  <div id="search-box">
    <input id="q" type="text" placeholder="Search anime..." autocomplete="off">
  </div>
  <div id="results"></div>
  <div id="ep-panel">
    <div id="ep-header">
      <span id="ep-anime-title">Episodes</span>
      <button id="back-btn">← Back</button>
    </div>
    <div id="ep-list"></div>
    <div id="ep-pages"></div>
  </div>
</div>

<div id="main">
  <div id="player-wrap">
    <div id="placeholder">Search an anime to start watching</div>
    <video id="v" controls style="display:none"></video>
  </div>
  <div id="controls">
    <span id="ep-title"></span>
    <select id="quality" style="display:none"></select>
    <span id="status"></span>
  </div>
</div>

<script>
const API = 'http://localhost:3001';
let hls, currentAnime = null, currentStreams = [], epCache = {};

// ── Search ───────────────────────────────────────────────────
let searchTimer;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 500);
});

async function doSearch(q) {
  document.getElementById('results').innerHTML = '<div style="padding:12px;color:#666;font-size:13px">Searching...</div>';
  try {
    const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    renderResults(data.results || []);
  } catch {
    document.getElementById('results').innerHTML = '<div style="padding:12px;color:#f66;font-size:13px">Search failed</div>';
  }
}

function renderResults(items) {
  const el = document.getElementById('results');
  if (!items.length) { el.innerHTML = '<div style="padding:12px;color:#666;font-size:13px">No results</div>'; return; }
  el.innerHTML = items.map((a, i) => `
    <div class="result-item" data-i="${i}">
      <img src="${a.image}" onerror="this.style.display='none'">
      <div class="result-info">
        <div class="result-title">${a.title}</div>
        <div class="result-meta">${a.title_english || ''} · ${a.episodes || '?'} eps</div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => selectAnime(items[+el.dataset.i]));
  });
}

// ── Episode list ─────────────────────────────────────────────
async function selectAnime(anime) {
  currentAnime = anime;
  document.getElementById('ep-anime-title').textContent = anime.title;
  document.getElementById('ep-panel').style.display = 'flex';
  document.getElementById('results').style.display = 'none';
  epCache = {};
  await loadEpisodes(1);
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('ep-panel').style.display = 'none';
  document.getElementById('results').style.display = 'block';
});

async function loadEpisodes(page) {
  document.getElementById('ep-list').innerHTML = '<div style="padding:12px;color:#666;font-size:13px">Loading...</div>';
  const cacheKey = `${currentAnime.malId}_${page}`;
  let data = epCache[cacheKey];
  if (!data) {
    const res = await fetch(`${API}/api/episodes?malId=${currentAnime.malId}&page=${page}`);
    data = await res.json();
    if (data.error) {
      document.getElementById('ep-list').innerHTML = `<div style="padding:12px;color:#f66;font-size:13px">${data.error}</div>`;
      return;
    }
    epCache[cacheKey] = data;
  }
  renderEpisodes(data, page);
}

function renderEpisodes(data, currentPage) {
  const list = document.getElementById('ep-list');
  list.innerHTML = (data.data || []).map(ep => `
    <div class="ep-item" data-malid="${currentAnime.malId}" data-epnum="${ep.number}">
      <span>Ep ${ep.number}</span>
      <span class="ep-title">${ep.title || ''}</span>
    </div>
  `).join('');
  list.querySelectorAll('.ep-item').forEach(el => {
    el.addEventListener('click', () => {
      list.querySelectorAll('.ep-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      resolveAndPlay(el.dataset.malid, el.dataset.epnum);
    });
  });

  const pages = document.getElementById('ep-pages');
  if (data.last_page > 1) {
    pages.innerHTML = Array.from({ length: data.last_page }, (_, i) => i + 1)
      .map(p => `<button class="page-btn${p === currentPage ? ' active' : ''}" data-p="${p}">${p}</button>`)
      .join('');
    pages.querySelectorAll('.page-btn').forEach(btn => {
      btn.addEventListener('click', () => loadEpisodes(+btn.dataset.p));
    });
    pages.style.display = 'flex';
  } else {
    pages.style.display = 'none';
  }
}

// ── Stream resolution + playback ─────────────────────────────
async function resolveAndPlay(malId, epNum) {
  setStatus(`<span class="spinner"></span>Resolving episode ${epNum}...`);
  document.getElementById('ep-title').textContent = `${currentAnime.title} · Ep ${epNum}`;
  document.getElementById('quality').style.display = 'none';
  document.getElementById('v').style.display = 'none';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('placeholder').textContent = `Resolving streams for episode ${epNum}...`;

  try {
    const res = await fetch(`${API}/api/streams?malId=${malId}&episode=${epNum}&lang=sub`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    currentStreams = data.streams || [];
    if (!currentStreams.length) throw new Error('No streams found');

    renderQuality(currentStreams);
    playStream(currentStreams[0]);
    setStatus('');
  } catch (e) {
    setStatus(`❌ ${e.message}`);
    document.getElementById('placeholder').textContent = `Failed: ${e.message}`;
  }
}

function renderQuality(streams) {
  const sel = document.getElementById('quality');
  sel.innerHTML = streams.map((s, i) => `<option value="${i}">${s.quality}</option>`).join('');
  sel.style.display = 'block';
  sel.onchange = e => playStream(streams[+e.target.value]);
}

function playStream(stream) {
  if (hls) { hls.destroy(); hls = null; }
  const v = document.getElementById('v');
  document.getElementById('placeholder').style.display = 'none';
  v.style.display = 'block';
  hls = new Hls();
  hls.loadSource(stream.url);
  hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());
  hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setStatus(`Stream error: ${d.details}`); });
}

function setStatus(html) {
  document.getElementById('status').innerHTML = html;
}
</script>
</body>
</html>
